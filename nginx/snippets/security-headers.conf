# Security headers, included in the server block and in every location that sets its own
# add_header (nginx only inherits add_header directives when a level defines none).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
# Calls need the camera and microphone on this site only.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
