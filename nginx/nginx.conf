user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $uri, not $request: query strings (e.g. WebSocket tickets) stay out of the logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # TLS Configuration
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # API responses that set no Cache-Control of their own get "no-store" (the API marks
    # thumbnails cacheable); an empty value means nginx adds no header.
    map $upstream_http_cache_control $api_cache_control {
        ""      "no-store";
        default "";
    }

    # Rate limiting zones (per client IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # The API server only serves HTTPS (self-signed in development, so it is not verified)
    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_verify off;

    # Upstream backend services
    # Re-resolve the API container's address (Docker DNS), so recreating it does not break nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        least_conn;
        server api-server:8000 max_fails=3 fail_timeout=30s resolve;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS Certificates
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Optional: Client certificate (mTLS)
        # ssl_client_certificate /etc/nginx/certs/client.crt;
        # ssl_verify_client optional;
        # ssl_verify_depth 2;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;

        # Web app files
        root /usr/share/nginx/html;
        index index.html;

        # Connection settings
        client_max_body_size 100M;
        proxy_buffering off;

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass https://api_backend;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # API routes with rate limiting
        location /api/ {
            # Rate limiting. The burst must absorb chat bursts (each incoming message makes every
            # open client send a read receipt); in development all browsers share one client IP.
            limit_req zone=api_limit burst=200 nodelay;
            limit_req_status 429;
            limit_conn addr 20;

            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control $api_cache_control always;

            # Proxy settings. X-Forwarded-For is overwritten, not appended to, so clients cannot
            # choose the IP address the API sees.
            proxy_pass https://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;

            # Error handling
            proxy_intercept_errors off;
        }

        # WebSocket endpoint
        location /ws/ {
            limit_conn addr 20;

            proxy_pass https://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # WebSocket timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            # Disable buffering for WebSocket
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Web app static assets (no-cache: the browser revalidates, so edits show up on reload)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Web app (single page; unknown paths fall back to index.html)
        location / {
            try_files $uri /index.html;
        }

        # Error pages
        error_page 404 /404.json;
        error_page 500 502 503 504 /50x.json;

        location = /50x.json {
            default_type application/json;
            return 500 '{"error":"Internal Server Error","status":500}';
        }

        location = /404.json {
            default_type application/json;
            return 404 '{"error":"Not Found","status":404}';
        }
    }
}
