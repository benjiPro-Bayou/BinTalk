version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - rowserrcheck
  settings:
    errcheck:
      # Cleanup calls whose errors cannot be acted on.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Conn).Close
        - (*database/sql.DB).Close
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/bintalk/bintalk-clone/pkg/kafka.Producer).Close
        - (io.Closer).Close
        - (net.Conn).Close
        - (*net/smtp.Client).Close
        - (*mime/multipart.File).Close
        - os.Remove
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers these
        - G202 # SQL built only from constant column lists; user input is always a bind parameter
        - G304 # file paths are built from server-generated UUIDs and configuration
        - G602 # the EXIF parser checks bounds before slicing
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
